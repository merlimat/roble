# The roble command. Argument handling follows encina's: clap with derive, a
# completions subcommand, prose in after_help, and errors on stderr with exit
# status 2.
[package]
name = "roble-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Puts, gets, scans and deletes the entries of a roble database, and inspects Pebble's files"
keywords = ["pebble", "roble", "lsm", "sstable", "cli"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "roble"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
compio = "0.19.2"
# Exact: the CLI calls roble's #[doc(hidden)] inspection methods, which may
# change in any release, so it builds only against the roble it shipped with.
roble = { path = "..", version = "=0.0.0-dev" }
roble-format = { path = "../format", version = "0.0.0-dev" }

[dev-dependencies]
roble-format = { path = "../format" }
tempfile = "3"

[lints]
workspace = true
