# The roble command. Argument handling follows encina's: clap with derive, a
# completions subcommand, prose in after_help, and errors on stderr with exit
# status 2.
[package]
name = "roble-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Inspects Pebble's files: roble sst dump and roble manifest dump."

[[bin]]
name = "roble"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
roble-format = { path = "../format", version = "0.0.0-dev" }

[dev-dependencies]
roble-format = { path = "../format" }

[lints]
workspace = true
