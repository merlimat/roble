[package]
name = "roble-format"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Encodes and decodes Pebble's on-disk formats. No I/O, no async, no engine."

[dependencies]
# crc32c for the block checksum Pebble writes by default (sstable/block: the
# Castagnoli CRC, rotated and offset — see checksum.rs).
crc32c = "0.6.8"
ruzstd = "0.9"
# Snappy for L1+ blocks, which is what Oxia configures (DESIGN.md §3).
snap = "1.1.1"
twox-hash = "2.1"

[lints]
workspace = true
