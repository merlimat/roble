[package]
name = "roble"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Embedded ordered key-value store whose on-disk files are Pebble's"

# Every feature documented, each gated item marked with the one it needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
compio = { version = "0.19.2", features = ["fs"] }
# The facade only, and without `attributes`: a library that logs says so and
# leaves choosing a subscriber to the application. roble emits events and
# never opens a span, so the `#[instrument]` macro — and the proc-macro
# crates behind it — are not wanted. Silent, and reading no clock, unless a
# subscriber is installed (§10).
tracing = { version = "0.1", default-features = false, features = ["std"] }
nanometer = { version = "0.1", optional = true }
# The version nanometer pins.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["metrics"], optional = true }
roble-format = { path = "format", version = "0.0.0-dev" }

# Metrics through OpenTelemetry (METRICS.md), on by default. Without it the
# options that take a meter provider do not exist, every handle records
# nothing, and the dependency tree holds no opentelemetry — whose exact pin,
# set by nanometer, an application would otherwise have to match.
[features]
default = ["opentelemetry"]
opentelemetry = ["dep:nanometer", "dep:opentelemetry"]
# `roble::sim`, the in-memory filesystem that fails and crashes on command,
# for an application's own crash tests (§12). Off by default: nothing a store
# runs on needs it.
sim = []

# The one test that needs a meter provider.
[[test]]
name = "metrics"
required-features = ["opentelemetry"]

[dev-dependencies]
# Itself with `sim`, which every failure-path test drives, so a plain
# `cargo test` builds them. No default features, so that
# `--no-default-features` still tests the store without opentelemetry. A
# path-only dev-dependency is dropped when the crate is published.
roble = { path = ".", default-features = false, features = ["sim"] }
compio = { version = "0.19.2", features = ["fs", "macros"] }
# Collects the metrics the tests check, with a reader they keep a handle to.
opentelemetry_sdk = { version = "=0.33.1", features = ["metrics", "experimental_metrics_custom_reader"] }
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"

# The format crate needs no unsafe and forbids it. The engine needs exactly two
# libc calls — flock and F_NOCACHE — so it denies unsafe and allows it at those
# two call sites, each with a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace]
members = ["bench", "cli", "format", "compat/minlz", "compat/sst-roundtrip", "compat/wal-replay"]
resolver = "3"

[workspace.package]
# The release workflow publishes the version its tag names, for roble,
# roble-format and roble-cli. See .github/workflows/release.yml.
version = "0.0.0-dev"
edition = "2024"
authors = ["Matteo Merli <matteo.merli@gmail.com>"]
license = "Apache-2.0"
# bench and compat are never published; roble, roble-format and roble-cli
# opt out of this.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `cargo fuzz` builds with `--cfg fuzzing`, under which roble-format skips
# checksum verification so a fuzzer can reach the parsers behind it
# (format/fuzz/README.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
