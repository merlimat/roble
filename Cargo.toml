[package]
name = "roble"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Embedded ordered key-value store whose on-disk files are Pebble's"

[dependencies]
compio = { version = "0.19.2", features = ["fs"] }
nanometer = "0.1"
# The version nanometer pins.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["metrics"] }
roble-format = { path = "format" }

[dev-dependencies]
compio = { version = "0.19.2", features = ["fs", "macros"] }
# Collects the metrics the tests check, with a reader they keep a handle to.
opentelemetry_sdk = { version = "=0.33.1", features = ["metrics", "experimental_metrics_custom_reader"] }
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"

# The format crate needs no unsafe and forbids it. The engine needs exactly two
# libc calls — flock and F_NOCACHE — so it denies unsafe and allows it at those
# two call sites, each with a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace]
members = ["cli", "format", "compat/minlz", "compat/sst-roundtrip", "compat/wal-replay"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Matteo Merli <matteo.merli@gmail.com>"]
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
