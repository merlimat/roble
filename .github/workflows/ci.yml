name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The workspace forbids unsafe and warns on missing docs; -D warnings is
      # what keeps both from decaying one allow at a time.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Metrics are a default feature; without it the engine swaps nanometer
      # for handles that cannot exist, and that build has to keep compiling.
      - run: cargo clippy -p roble --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test -p roble --no-default-features --locked

  go:
    name: Go harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum
      - name: gofmt
        working-directory: harness
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: harness
        run: go vet ./...
      - name: go build
        working-directory: harness
        run: go build ./...

  # The gate DESIGN.md §12 calls "the gate": compatibility tested in both
  # directions, against Go Pebble itself rather than against roble's own idea
  # of the format. These need both toolchains, which is why they are their own
  # job rather than part of the Rust one.
  compat:
    name: Cross-implementation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum

      - name: roble writes, Go Pebble reads
        run: compat/sst-roundtrip/run.sh

      - name: the minlz crate decodes Go minio/minlz
        run: compat/minlz/run.sh

      - name: Go Pebble replays the log roble wrote
        run: compat/wal-replay/run.sh

      - name: roble and Go Pebble take turns at one random history
        run: compat/differential/run.sh
        env:
          DIFFERENTIAL_OUT: ${{ runner.temp }}/differential

      # A killed turn's timing does not replay, so what a failure left — the
      # directory and the script, cut as the turns that ran had it — is kept.
      - name: Upload the differential's directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential
          path: |
            ${{ runner.temp }}/differential
            !${{ runner.temp }}/differential/pebble-differential
          if-no-files-found: ignore

      # The committed golden corpus has to be what the pinned harness still
      # produces, or the tables roble is judged against have drifted from the
      # code that made them.
      #
      # Only the dumps are compared, not the .sst bytes. Pebble's writer is
      # deterministic for a given architecture, but a compressed block's bytes
      # are not necessarily portable between them, and this runs on amd64
      # while the corpus was generated on arm64. The dumps are the semantic
      # content and are architecture-independent.
      - name: the golden corpus is still what the harness produces
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          (cd harness && go run ./golden-sst "$regenerated")
          status=0
          for committed in format/tests/golden/*.dump; do
            name="$(basename "$committed")"
            if ! diff -u "$committed" "$regenerated/$name"; then
              echo "::error file=format/tests/golden/$name::stale; regenerate with 'cd harness && go run ./golden-sst ../format/tests/golden'"
              status=1
            fi
          done
          exit $status

      # Pebble's answers to the seek probes have to be what the pinned harness
      # still gives. This file is the ground truth for every seek roble makes,
      # so a silent drift here would quietly stop testing the read path.
      - name: the seek probes are still what Pebble answers
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          cp format/tests/golden/*.sst "$regenerated/"
          (cd harness && go run ./seek-probes "$regenerated")
          if ! diff -u format/tests/golden/seeks.txt "$regenerated/seeks.txt"; then
            echo "::error file=format/tests/golden/seeks.txt::stale; regenerate with 'cd harness && go run ./seek-probes ../format/tests/golden'"
            exit 1
          fi

      # Pebble's own test cases that roble's tests run, copied with Pebble's
      # licence. They are judged against roble only while they are the cases
      # Pebble has at the pin, so a Pebble upgrade that left them behind fails
      # here rather than going on testing the old rule.
      - name: the Pebble test data is still Pebble's at the pin
        run: |
          pebble="$(cd harness && go mod download github.com/cockroachdb/pebble/v2 && go list -m -f '{{.Dir}}' github.com/cockroachdb/pebble/v2)"
          status=0
          for pair in \
            "tests/pebble/l0_sublevels:internal/manifest/testdata/l0_sublevels" \
            "tests/pebble/range_del:testdata/range_del" \
            "format/tests/pebble/fragmenter:internal/keyspan/testdata/fragmenter" \
            "tests/pebble/LICENSE:LICENSE" \
            "format/tests/pebble/LICENSE:LICENSE"; do
            ours="${pair%%:*}"
            theirs="$pebble/${pair#*:}"
            if ! diff -u "$theirs" "$ours"; then
              echo "::error file=$ours::not Pebble's at the pin; copy it again from $theirs"
              status=1
            fi
          done
          exit $status

      # Pebble's answers to the read probes, and the shape of the database they
      # are asked of: the generator refuses to write a fixture that collapsed
      # into one level, so a drift that flattened it fails here rather than
      # quietly testing much less.
      - name: the read probes are still what Pebble answers
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          (cd harness && go run ./read-probes "$regenerated")
          status=0
          for name in db-reads.probes db-reads.scans; do
            if ! diff -u "tests/golden/$name" "$regenerated/$name"; then
              echo "::error file=tests/golden/$name::stale; regenerate with 'cd harness && go run ./read-probes ../tests/golden'"
              status=1
            fi
          done
          exit $status

      # The same check for the whole-database fixtures. These are generated
      # with compression off, so unlike the sstable corpus their table sizes
      # are portable between architectures and the dumps compare exactly.
      - name: the database fixtures are still what the harness produces
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          (cd harness && go run ./db-fixture "$regenerated")
          status=0
          for committed in tests/golden/*.dump; do
            name="$(basename "$committed")"
            if ! diff -u "$committed" "$regenerated/$name"; then
              echo "::error file=tests/golden/$name::stale; regenerate with 'cd harness && go run ./db-fixture ../tests/golden'"
              status=1
            fi
          done
          exit $status
