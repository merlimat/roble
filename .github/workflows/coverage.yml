name: Coverage

on:
  pull_request:
  # A pull request can restore the cache main saved, but not another pull
  # request's, so only runs on main save it (save-if below).
  push:
    branches: [main]

permissions:
  contents: read
  # To post the totals as a commit status.
  statuses: write

# A new push to a pull request cancels its previous run. A run on main finishes,
# to save its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # compat/ and bench/ hold harnesses that a run.sh drives against Go,
      # not crates with tests of their own: counted here they would only
      # report their own binaries as unrun. The `--exclude`s keep them from
      # being built at all; the paths in the regex are what catch the next
      # one, because a harness added later would otherwise arrive at 0% and,
      # now that a drop fails this job, fail it for the one change that could
      # not have caused it. bench/ is exactly that case — the comment above
      # predicted it before `roble-bench` existed, and the prediction cost
      # this job one red run to collect.
      #
      # What makes a crate belong on this list is that running it *is* the
      # test: `compat/*/run.sh` passes or fails, and `bench/run.sh` prints
      # numbers a person reads. Neither has anything a `cargo test` could
      # assert, so neither has coverage to report.
      #
      # cargo-llvm-cov leaves out tests.rs; sim.rs is test code too, the
      # simulated filesystem the failure-path tests drive.
      # The cache above restores `target/`, and a restored `target/` can carry
      # profile data from an earlier commit's run. Merged in, it counts lines
      # that this tree does not have: a run of this branch reported 275 missed
      # lines against the 236 a clean measurement of the identical `src/` gives,
      # and failed the gate for it. Cleaning first makes the number depend on
      # this commit alone, which a gate that fails a pull request has to.
      - name: Clear any profile data the cache restored
        run: cargo llvm-cov clean --workspace
      - name: Run the tests under cargo-llvm-cov
        run: >
          cargo llvm-cov --workspace --locked
          --exclude minlz-compat --exclude sst-roundtrip --exclude roble-bench
          --json --output-path target/coverage.json
          --ignore-filename-regex '(^|/)compat/|(^|/)bench/|(^|/)src/sim\.rs$'
      - name: Summarize
        id: summary
        run: python3 .github/scripts/coverage-summary.py target/coverage.json
      - name: Post the totals as a commit status
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOTALS: ${{ steps.summary.outputs.totals }}
        run: >
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=success -f context=coverage -f description="$TOTALS"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # What this branch is measured against: the totals this workflow posted
      # as a status on the commit the pull request branched from. Nothing is
      # stored in the repository for it, so there is no baseline file to go
      # stale and nothing to bump by hand when coverage improves.
      #
      # A base with no status — the first run after this lands, or a branch
      # cut from a commit whose run was cancelled — leaves `lines` empty and
      # the gate below is skipped rather than guessing.
      - name: Find the coverage its base recorded
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          posted=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE/statuses" \
            --jq '[.[] | select(.context == "coverage")] | first | .description // empty' \
            2>/dev/null || true)
          echo "posted: ${posted:-<none>}"
          lines=$(printf '%s' "$posted" | sed -n 's/^lines \([0-9.]*\)%.*/\1/p')
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
      # After the status above, so the number is recorded whichever way this
      # goes: a run that fails here has still said what the coverage was.
      - name: Fail if the coverage dropped
        if: github.event_name == 'pull_request' && steps.base.outputs.lines != ''
        run: >
          python3 .github/scripts/coverage-summary.py target/coverage.json
          --fail-under '${{ steps.base.outputs.lines }}'
      # A pull request from a fork gets a read-only token, which can't post a status.
      - name: Note that a fork gets no status
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: >
          echo "This pull request comes from a fork, whose token can't post the totals
          as a status." >> "$GITHUB_STEP_SUMMARY"
