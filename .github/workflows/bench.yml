name: Benchmark

# **Asked for, never automatic.** A shared CI runner is the wrong place to
# decide anything from a rate: its disk, its neighbours and its CPU budget are
# all outside this repository's control, and a benchmark that fails a pull
# request for being 8% slower than a runner last week would be noise with a
# veto. So this is `workflow_dispatch` only, it posts a table to the job
# summary, and it gates nothing.
#
# What it is for is the one thing a laptop cannot give: **Linux**. Go's
# `os.File.Sync` is `fcntl(F_FULLFSYNC)` on macOS and compio's is `fsync`, so
# the load rows of a run with the WAL on are not comparable there at all
# (bench/README.md). On Linux they are all `fsync`, which is also what Oxia
# runs on.
on:
  workflow_dispatch:
    inputs:
      engines:
        description: Which engines to run, space separated
        default: roble rocksdb encina

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmark on Linux
    runs-on: ubuntu-latest
    # Three engines over several passes, one of which writes every record one
    # commit at a time — at the default inputs that is 3,000,000 commits, and
    # for a copy-on-write B+tree with no batching it is the longest single
    # thing this workflow does.
    # Three engines, six passes, ten seconds a timed phase, over a 423 MiB
    # store. That is roughly half an hour on a quiet machine and a shared
    # runner is slower, so the ceiling is well above the expectation rather
    # than near it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Not shared with CI's cache: this builds the two optional engines,
      # which no other job does, and would otherwise evict what the gate
      # needs on every run.
      #
      # One cache per set of engines, because a run saves what it built and
      # nothing else. Under a single key a `roble` run saved a cache with no
      # RocksDB in it, and the next run of all four then compiled RocksDB
      # from source — which is what three roble-only runs in a row left the
      # next four-engine run to do.
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ github.event.inputs.engines }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What librocksdb-sys needs to build its bindings. The other three
      # engines need nothing installed.
      - name: Install what RocksDB needs
        if: contains(github.event.inputs.engines, 'rocksdb')
        run: sudo apt-get update && sudo apt-get install --yes clang libclang-dev
      - name: Run the benchmark
        # The standard and nothing else (bench/README.md, "One core, 512 MiB"):
        # one CPU and 512 MiB a process, two scenarios. A runner has no systemd
        # user session, so run.sh applies the cap through a system scope with
        # the runner's passwordless sudo, and checks that it holds.
        env:
          ENGINES: ${{ github.event.inputs.engines }}
          BENCH_DIR: ${{ runner.temp }}/bench-stores
        run: ./bench/run.sh | tee bench.txt
      - name: Post it to the job summary
        if: always()
        run: |
          {
            echo "## Benchmark on \`$(uname -srm)\`"
            echo
            echo "Engines: \`${{ github.event.inputs.engines }}\`, one CPU and 512 MiB each,"
            echo "over a store that fits the block cache and one that does not fit in memory."
            echo
            echo "A shared runner's disk and neighbours are not this repository's to control,"
            echo "so read the ratios between engines in one run, not a rate against another run."
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: bench.txt
